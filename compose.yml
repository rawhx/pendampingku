services:
    laravel:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: pendampingku_laravel
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        ports:
            - "${APP_PORT:-8000}:8000"
        command: php artisan serve --host=0.0.0.0
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - pendampingku

    node:
        image: node:22-alpine
        container_name: pendampingku_node
        working_dir: /app
        volumes:
            - .:/app
            - node_modules:/app/node_modules
        ports:
            - "${VITE_PORT:-5173}:5173"
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        networks:
            - pendampingku

    postgres:
        image: postgres:17-alpine
        container_name: pendampingku_postgres
        environment:
            POSTGRES_DB: ${DB_DATABASE:-pendampingku}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
        ports:
            - "${DB_FORWARD_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - pendampingku

    redis:
        image: redis:alpine
        container_name: pendampingku_redis
        ports:
            - "${REDIS_FORWARD_PORT:-6379}:6379"
        networks:
            - pendampingku

networks:
    pendampingku:
        driver: bridge

volumes:
    postgres_data:
    node_modules: